<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Técnico: TypeScript, NestJS & React</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Space Grotesk, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            obsidian: '#0B0D10',
            surface: '#12161D',
            panel: '#171C26',
            ts: '#3178C6',
            nest: '#E0234E',
            react: '#00D8FF',
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-obsidian: #0B0D10;
      --bg-surface: #12161D;
      --border-grid: rgba(148, 163, 184, 0.14);
      --border-strong: #2B3445;
      --accent-ts: #3178C6;
      --accent-nest: #E0234E;
      --accent-react: #00D8FF;
    }

    body {
      background-color: var(--bg-obsidian);
      color: #F1F5F9;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      /* Textura autoral: Blueprint Grid duplo + pontos técnicos */
      background-image: 
        radial-gradient(rgba(0, 216, 255, 0.12) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px, 128px 128px, 128px 128px;
      background-position: -1px -1px, 0 0, 0 0;
    }

    /* Cartão Neo-Brutalista Técnico com sombra sólida offset */
    .blueprint-card {
      background: linear-gradient(180deg, #141922 0%, #10141C 100%);
      border: 1.5px solid #2D3748;
      box-shadow: 6px 6px 0px #050608, 6px 6px 0px 1px #2D3748;
      position: relative;
    }

    /* Detalhes de mira/canto técnico (Crosshairs) */
    .corner-ticks::before,
    .corner-ticks::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      pointer-events: none;
    }
    .corner-ticks::before {
      top: -1.5px;
      left: -1.5px;
      border-top: 2px solid #00D8FF;
      border-left: 2px solid #00D8FF;
    }
    .corner-ticks::after {
      bottom: -1.5px;
      right: -1.5px;
      border-bottom: 2px solid #E0234E;
      border-right: 2px solid #E0234E;
    }

    /* Botão Principal com deslocamento físico ao clicar */
    .btn-cyber {
      background: #F8FAFC;
      color: #0B0D10;
      border: 1.5px solid #F8FAFC;
      box-shadow: 4px 4px 0px #00D8FF;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.14s ease, background-color 0.14s ease;
    }
    .btn-cyber:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #00D8FF;
      background: #FFFFFF;
    }
    .btn-cyber:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #00D8FF;
    }
    .btn-cyber:disabled {
      background: #1E2532;
      border-color: #2D3748;
      color: #64748B;
      box-shadow: none;
    }

    /* Botão Secundário Blueprint */
    .btn-outline-cyber {
      background: #12161D;
      color: #E2E8F0;
      border: 1.5px solid #334155;
      box-shadow: 3px 3px 0px #06080A;
      transition: all 0.14s ease;
    }
    .btn-outline-cyber:hover:not(:disabled) {
      border-color: #94A3B8;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #334155;
    }

    /* Alternativas Interativas */
    .option-tile {
      background: #0E1218;
      border: 1.5px solid #252E3D;
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .option-tile:hover {
      border-color: #475569;
      background: #141A23;
      transform: translateX(4px);
    }
    .option-tile-selected-ts {
      background: rgba(49, 120, 198, 0.14);
      border-color: #3178C6;
      box-shadow: 4px 4px 0px #3178C6;
      transform: translate(-2px, -2px);
    }
    .option-tile-selected-nest {
      background: rgba(224, 35, 78, 0.14);
      border-color: #E0234E;
      box-shadow: 4px 4px 0px #E0234E;
      transform: translate(-2px, -2px);
    }
    .option-tile-selected-react {
      background: rgba(0, 216, 255, 0.12);
      border-color: #00D8FF;
      box-shadow: 4px 4px 0px #00D8FF;
      transform: translate(-2px, -2px);
    }

    /* Animação de entrada */
    .fade-in {
      animation: slideReveal 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideReveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Scrollbar customizada */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0B0D10; }
    ::-webkit-scrollbar-thumb { background: #2D3748; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-obsidian text-slate-100 selection:bg-react selection:text-obsidian">
  
  <div id="root" class="flex-grow flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // Banco de 20 questões técnicas (TypeScript, NestJS e React)
    const QUESTIONS_DATA = [
      // --- TYPESCRIPT (7 questões) ---
      {
        id: 1,
        category: "TypeScript",
        question: "Qual é a principal diferença entre 'interface' e 'type' (Type Alias) no TypeScript moderno?",
        options: [
          "Interfaces não suportam propriedades opcionais, enquanto types suportam.",
          "Interfaces permitem Declaration Merging (fusão de declarações com o mesmo nome), enquanto types não.",
          "Types só podem representar tipos primitivos e nunca objetos.",
          "Interfaces são compiladas para classes JavaScript em tempo de execução.",
          "Não existe nenhuma diferença técnica ou semântica entre os dois."
        ],
        correctIndex: 1,
        explanation: "Interfaces podem ser declaradas múltiplas vezes no mesmo escopo e o TypeScript funde suas propriedades (Declaration Merging), o que é útil para estender tipos de bibliotecas."
      },
      {
        id: 2,
        category: "TypeScript",
        question: "Para que serve o Utility Type 'Partial<T>' no TypeScript?",
        options: [
          "Torna todas as propriedades do tipo T obrigatórias.",
          "Remove todas as propriedades nulas ou indefinidas de T.",
          "Constrói um tipo com todas as propriedades de T definidas como opcionais.",
          "Extrai apenas os métodos públicos de uma classe T.",
          "Converte todas as propriedades de T em somente leitura (readonly)."
        ],
        correctIndex: 2,
        explanation: "Partial<T> transforma todas as propriedades do tipo T em opcionais (?), sendo muito usado em operações de atualização parcial (PATCH/UPDATE)."
      },
      {
        id: 3,
        category: "TypeScript",
        question: "Qual é a vantagem de utilizar o tipo 'unknown' em vez de 'any' quando não sabemos o tipo de um dado externo?",
        options: [
          "O tipo 'unknown' permite chamar qualquer método diretamente sem verificação.",
          "O tipo 'unknown' exige verificação ou narrowing de tipo antes de realizar operações com o valor.",
          "O tipo 'unknown' é convertido automaticamente para string em tempo de execução.",
          "O tipo 'unknown' ignora erros de sintaxe no arquivo inteiro.",
          "Não há diferença; 'unknown' é apenas um apelido depreciado para 'any'."
        ],
        correctIndex: 1,
        explanation: "'unknown' é a contraparte type-safe do 'any'. Você pode atribuir qualquer valor a ele, mas não pode acessar propriedades ou invocá-lo sem antes validar seu tipo."
      },
      {
        id: 4,
        category: "TypeScript",
        question: "O que o operador 'keyof' retorna quando aplicado a um tipo de objeto 'User'?",
        options: [
          "Um array em tempo de execução contendo os valores das propriedades de User.",
          "Uma union type literal contendo os nomes (chaves) das propriedades públicas de User.",
          "O número total de propriedades definidas na interface User.",
          "Uma cópia profunda (deep clone) da estrutura do tipo User.",
          "Um booleano indicando se User possui propriedades privadas."
        ],
        correctIndex: 1,
        explanation: "O operador 'keyof T' produz uma união de strings ou símbolos literais representando todas as chaves conhecidas de T."
      },
      {
        id: 5,
        category: "TypeScript",
        question: "Qual recurso do TypeScript permite criar componentes, funções e classes reutilizáveis que preservam a tipagem de entrada na saída?",
        options: [
          "Decorators",
          "Namespaces",
          "Generics (<T>)",
          "Mixins",
          "Enums"
        ],
        correctIndex: 2,
        explanation: "Generics (<T>) funcionam como variáveis de tipo, permitindo criar estruturas flexíveis sem perder a segurança de tipos (type safety)."
      },
      {
        id: 6,
        category: "TypeScript",
        question: "O que faz o modificador 'readonly' em uma propriedade de interface ou classe no TypeScript?",
        options: [
          "Criptografa o valor da propriedade na memória.",
          "Impede que a propriedade seja reatribuída após a sua inicialização durante a verificação de tipos.",
          "Torna a propriedade privada e inacessível fora da classe.",
          "Garante que objetos aninhados dentro da propriedade sejam profundamente imutáveis em runtime.",
          "Exporta a propriedade automaticamente para outros módulos."
        ],
        correctIndex: 1,
        explanation: "'readonly' garante em tempo de compilação que a referência da propriedade não seja alterada após a inicialização."
      },
      {
        id: 7,
        category: "TypeScript",
        question: "Qual é a função de um 'Type Guard' (como o operador 'typeof', 'instanceof' ou predicados 'x is Tipo')?",
        options: [
          "Bloquear requisições HTTP não autenticadas no backend.",
          "Restringir (narrow) um tipo mais amplo (como union types) para um tipo mais específico dentro de um bloco condicional.",
          "Converter código TypeScript diretamente para WebAssembly.",
          "Remover comentários e espaços em branco durante o build.",
          "Gerar documentação automática em Swagger/OpenAPI."
        ],
        correctIndex: 1,
        explanation: "Type Guards permitem que o compilador do TypeScript entenda qual é o tipo específico de uma variável dentro de um bloco if/switch."
      },

      // --- NESTJS (7 questões) ---
      {
        id: 8,
        category: "NestJS",
        question: "Qual padrão arquitetural é a base central do NestJS para gerenciar dependências entre Services, Controllers e outros componentes?",
        options: [
          "Singleton Manual Global",
          "Injeção de Dependência (Dependency Injection) e Inversão de Controle (IoC)",
          "Event Sourcing Puro",
          "Active Record Pattern obrigatório",
          "Observer Pattern sem decoradores"
        ],
        correctIndex: 1,
        explanation: "O NestJS possui um container de IoC integrado que gerencia a instanciação e injeção de dependências (Providers) automaticamente via construtor."
      },
      {
        id: 9,
        category: "NestJS",
        question: "Qual é a responsabilidade principal de um 'Controller' no NestJS?",
        options: [
          "Executar queries SQL diretamente no banco de dados.",
          "Gerenciar variáveis de ambiente e conexões WebSocket exclusivamente.",
          "Receber requisições HTTP de entrada, extrair parâmetros e retornar respostas ao cliente.",
          "Compilar arquivos TypeScript para JavaScript.",
          "Armazenar o estado global da aplicação em memória."
        ],
        correctIndex: 2,
        explanation: "Controllers são responsáveis por lidar com as rotas HTTP (@Get, @Post, etc.), delegando regras de negócio complexas para os Services."
      },
      {
        id: 10,
        category: "NestJS",
        question: "Qual decorator é utilizado para marcar uma classe como um Provider que pode ser gerenciado pelo sistema de injeção de dependência do NestJS?",
        options: [
          "@Module()",
          "@Controller()",
          "@Injectable()",
          "@InjectRepository()",
          "@Component()"
        ],
        correctIndex: 2,
        explanation: "O decorator @Injectable() anexa metadados que informam ao NestJS que a classe pode ser instanciada e injetada pelo container IoC."
      },
      {
        id: 11,
        category: "NestJS",
        question: "No ciclo de vida de uma requisição no NestJS, qual componente é comumente utilizado para validar e transformar dados de entrada (como DTOs)?",
        options: [
          "Guards",
          "Pipes (ex: ValidationPipe)",
          "Interceptors",
          "Exception Filters",
          "Middlewares"
        ],
        correctIndex: 1,
        explanation: "Pipes operam nos argumentos enviados ao handler da rota, sendo ideais para transformação de tipos (ParseIntPipe) e validação de DTOs (ValidationPipe)."
      },
      {
        id: 12,
        category: "NestJS",
        question: "Qual é a principal finalidade de um 'Guard' (ex: AuthGuard) no NestJS?",
        options: [
          "Formatar o JSON de saída antes de enviar ao cliente.",
          "Capturar exceções não tratadas e retornar status HTTP 500.",
          "Determinar se uma requisição deve ou não ser processada pelo handler da rota com base em permissões/autenticação.",
          "Realizar cache de respostas no Redis.",
          "Mapear entidades do TypeORM para tabelas."
        ],
        correctIndex: 2,
        explanation: "Guards têm uma responsabilidade única: autorização/autenticação. Eles retornam um booleano indicando se a requisição pode prosseguir."
      },
      {
        id: 13,
        category: "NestJS",
        question: "Como o NestJS organiza a estrutura modular da aplicação e encapsula providers?",
        options: [
          "Através de arquivos package.json aninhados.",
          "Através de classes decoradas com @Module(), definindo imports, controllers, providers e exports.",
          "Por meio de convenção rígida de nomes de pastas sem decorators.",
          "Usando apenas funções exportadas em um único arquivo main.ts.",
          "Através de XML de configuração."
        ],
        correctIndex: 1,
        explanation: "Módulos (@Module) organizam o código em domínios coesos. Para que um provider seja usado em outro módulo, ele precisa ser listado em 'exports'."
      },
      {
        id: 14,
        category: "NestJS",
        question: "Qual recurso do NestJS permite interceptar a execução antes e depois do método do controller, permitindo transformar a resposta ou medir o tempo de execução?",
        options: [
          "Pipes",
          "Interceptors (baseados em RxJS Observables)",
          "DTOs",
          "Guards",
          "Entities"
        ],
        correctIndex: 1,
        explanation: "Interceptors envolvem a execução da requisição/resposta utilizando RxJS, permitindo logging, transformação de resposta e tratamento de timeout."
      },

      // --- REACT (6 questões) ---
      {
        id: 15,
        category: "React",
        question: "Qual é o comportamento correto do hook 'useEffect' quando passado um array de dependências vazio '[]'?",
        options: [
          "Executa o efeito a cada nova renderização do componente.",
          "Nunca executa o efeito, nem mesmo na montagem.",
          "Executa o efeito apenas uma vez após a montagem inicial do componente (mount).",
          "Executa o efeito apenas quando o usuário clica em algum botão.",
          "Causa um erro de compilação no React 18+."
        ],
        correctIndex: 2,
        explanation: "Um array de dependências vazio [] indica que o efeito não depende de nenhum valor de props ou state, rodando apenas uma vez na montagem (e limpando no unmount)."
      },
      {
        id: 16,
        category: "React",
        question: "Por que não devemos modificar o estado diretamente no React (ex: state.count = 5) em vez de usar a função atualizadora (setState)?",
        options: [
          "Porque o JavaScript proíbe mutação de objetos em modo estrito.",
          "Porque a mutação direta não dispara uma nova renderização (re-render) e quebra a imutabilidade esperada pelo React.",
          "Porque o método setState salva os dados automaticamente no localStorage.",
          "Porque modificar diretamente apaga o Virtual DOM inteiro.",
          "Porque apenas variáveis globais podem ser alteradas diretamente."
        ],
        correctIndex: 1,
        explanation: "O React compara referências de estado para saber quando atualizar a interface. Chamar a função setter agenda a re-renderização com o novo estado."
      },
      {
        id: 17,
        category: "React",
        question: "Qual é a importância da prop 'key' ao renderizar listas de elementos com '.map()' no React?",
        options: [
          "Serve para aplicar estilos CSS automaticamente aos itens ímpares.",
          "Ajuda o algoritmo de reconciliação do React a identificar quais itens foram alterados, adicionados ou removidos com eficiência.",
          "É obrigatória apenas quando a lista tem mais de 100 itens.",
          "Define a ordem alfabética de exibição dos elementos na tela.",
          "Envia o identificador único automaticamente para o backend."
        ],
        correctIndex: 1,
        explanation: "Keys estáveis e únicas permitem que o React preserve o estado interno dos componentes da lista e evite recriações desnecessárias no DOM."
      },
      {
        id: 18,
        category: "React",
        question: "Qual hook do React é indicado para memorizar o resultado de um cálculo computacionalmente caro entre renderizações?",
        options: [
          "useRef",
          "useMemo",
          "useContext",
          "useReducer",
          "useLayoutEffect"
        ],
        correctIndex: 1,
        explanation: "useMemo armazena em cache o resultado de uma função e só o recalcula quando uma de suas dependências sofrer alteração."
      },
      {
        id: 19,
        category: "React",
        question: "Sobre o hook 'useRef', qual afirmação é verdadeira?",
        options: [
          "Alterar 'ref.current' dispara imediatamente uma nova renderização do componente.",
          "Pode ser usado tanto para acessar elementos do DOM diretamente quanto para guardar valores mutáveis que persistem entre renderizações sem causar re-render.",
          "Só pode ser utilizado em componentes de classe.",
          "Substitui completamente a necessidade de usar useState.",
          "É apagado toda vez que o componente recebe novas props."
        ],
        correctIndex: 1,
        explanation: "useRef retorna um objeto mutável { current: initialValue } que permanece o mesmo durante todo o ciclo de vida do componente sem provocar re-renderizações."
      },
      {
        id: 20,
        category: "React",
        question: "O que significa o conceito de 'Lifting State Up' (Elevar o Estado) no React?",
        options: [
          "Mover todos os estados da aplicação para variáveis globais fora do React.",
          "Mover o estado compartilhado para o ancestral comum mais próximo dos componentes que precisam sincronizar esses dados.",
          "Salvar todos os formulários na nuvem antes de validar.",
          "Converter componentes funcionais em componentes de classe.",
          "Utilizar apenas CSS Grid para posicionar elementos no topo da tela."
        ],
        correctIndex: 1,
        explanation: "Como o fluxo de dados no React é unidirecional (top-down), elevar o estado ao ancestral comum permite compartilhar e sincronizar dados entre componentes irmãos via props."
      }
    ];

    const PASSING_PERCENTAGE = 70;
    const MIN_CORRECT_ANSWERS = Math.ceil((QUESTIONS_DATA.length * PASSING_PERCENTAGE) / 100); // 14 de 20
    const OPTION_LETTERS = ['A', 'B', 'C', 'D', 'E'];

    // Configuração visual temática por tecnologia
    const TECH_THEME = {
      TypeScript: {
        badge: "bg-[#3178C6]/15 text-[#66A8F5] border-[#3178C6]/60",
        dot: "bg-[#3178C6]",
        bar: "bg-[#3178C6]",
        selectedTile: "option-tile-selected-ts",
        selectedLetter: "bg-[#3178C6] text-white border-[#3178C6]",
        code: "TS // STATIC_TYPES"
      },
      NestJS: {
        badge: "bg-[#E0234E]/15 text-[#FF6B8B] border-[#E0234E]/60",
        dot: "bg-[#E0234E]",
        bar: "bg-[#E0234E]",
        selectedTile: "option-tile-selected-nest",
        selectedLetter: "bg-[#E0234E] text-white border-[#E0234E]",
        code: "NEST // MODULAR_ARCH"
      },
      React: {
        badge: "bg-[#00D8FF]/15 text-[#5CE6FF] border-[#00D8FF]/60",
        dot: "bg-[#00D8FF]",
        bar: "bg-[#00D8FF]",
        selectedTile: "option-tile-selected-react",
        selectedLetter: "bg-[#00D8FF] text-[#0B0D10] border-[#00D8FF]",
        code: "REACT // UI_ENGINE"
      }
    };

    // Badge de Categoria Estilo Blueprint
    function CategoryBadge({ category, showTagCode = false }) {
      const theme = TECH_THEME[category] || TECH_THEME.TypeScript;
      return (
        <span className={`inline-flex items-center gap-2 px-3 py-1 rounded-sm text-xs font-mono font-semibold uppercase tracking-wider border ${theme.badge}`}>
          <span className={`w-2 h-2 rounded-xs ${theme.dot}`}></span>
          <span>{category}</span>
          {showTagCode && (
            <span className="opacity-60 hidden sm:inline">| {theme.code.split('// ')[1]}</span>
          )}
        </span>
      );
    }

    function App() {
      // Estados principais da aplicação
      const [screen, setScreen] = useState('start'); // 'start' | 'quiz' | 'result'
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({}); // { [questionId]: optionIndex }
      const [showReview, setShowReview] = useState(false);

      const totalQuestions = QUESTIONS_DATA.length;
      const currentQuestion = QUESTIONS_DATA[currentQuestionIndex];
      const answeredCount = Object.keys(userAnswers).length;

      // Inicia ou reinicia o quiz
      const handleStartQuiz = () => {
        setUserAnswers({});
        setCurrentQuestionIndex(0);
        setShowReview(false);
        setScreen('quiz');
      };

      // Registra a resposta da questão atual
      const handleSelectOption = (optionIndex) => {
        setUserAnswers((prev) => ({
          ...prev,
          [currentQuestion.id]: optionIndex
        }));
      };

      // Navegação entre questões
      const handleNext = () => {
        if (currentQuestionIndex < totalQuestions - 1) {
          setCurrentQuestionIndex((prev) => prev + 1);
        } else {
          setScreen('result');
        }
      };

      const handlePrevious = () => {
        if (currentQuestionIndex > 0) {
          setCurrentQuestionIndex((prev) => prev - 1);
        }
      };

      // Cálculo de pontuação e desempenho por tecnologia
      const results = useMemo(() => {
        let score = 0;
        const byCategory = {
          TypeScript: { correct: 0, total: 0 },
          NestJS: { correct: 0, total: 0 },
          React: { correct: 0, total: 0 }
        };

        QUESTIONS_DATA.forEach((q) => {
          byCategory[q.category].total += 1;
          if (userAnswers[q.id] === q.correctIndex) {
            score += 1;
            byCategory[q.category].correct += 1;
          }
