<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Técnico: TypeScript, NestJS & React</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Space Grotesk, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            obsidian: '#0B0D10',
            surface: '#12161D',
            panel: '#171C26',
            ts: '#3178C6',
            nest: '#E0234E',
            react: '#00D8FF',
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-obsidian: #0B0D10;
      --bg-surface: #12161D;
      --border-grid: rgba(148, 163, 184, 0.14);
      --border-strong: #2B3445;
      --accent-ts: #3178C6;
      --accent-nest: #E0234E;
      --accent-react: #00D8FF;
    }

    body {
      background-color: var(--bg-obsidian);
      color: #F1F5F9;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-image: 
        radial-gradient(rgba(0, 216, 255, 0.12) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px, 128px 128px, 128px 128px;
      background-position: -1px -1px, 0 0, 0 0;
    }

    .blueprint-card {
      background: linear-gradient(180deg, #141922 0%, #10141C 100%);
      border: 1.5px solid #2D3748;
      box-shadow: 6px 6px 0px #050608, 6px 6px 0px 1px #2D3748;
      position: relative;
    }

    .corner-ticks::before,
    .corner-ticks::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      pointer-events: none;
    }
    .corner-ticks::before {
      top: -1.5px;
      left: -1.5px;
      border-top: 2px solid #00D8FF;
      border-left: 2px solid #00D8FF;
    }
    .corner-ticks::after {
      bottom: -1.5px;
      right: -1.5px;
      border-bottom: 2px solid #E0234E;
      border-right: 2px solid #E0234E;
    }

    .btn-cyber {
      background: #F8FAFC;
      color: #0B0D10;
      border: 1.5px solid #F8FAFC;
      box-shadow: 4px 4px 0px #00D8FF;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.14s ease, background-color 0.14s ease;
    }
    .btn-cyber:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #00D8FF;
      background: #FFFFFF;
    }
    .btn-cyber:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #00D8FF;
    }
    .btn-cyber:disabled {
      background: #1E2532;
      border-color: #2D3748;
      color: #64748B;
      box-shadow: none;
    }

    .btn-outline-cyber {
      background: #12161D;
      color: #E2E8F0;
      border: 1.5px solid #334155;
      box-shadow: 3px 3px 0px #06080A;
      transition: all 0.14s ease;
    }
    .btn-outline-cyber:hover:not(:disabled) {
      border-color: #94A3B8;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #334155;
    }

    .option-tile {
      background: #0E1218;
      border: 1.5px solid #252E3D;
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .option-tile:hover {
      border-color: #475569;
      background: #141A23;
      transform: translateX(4px);
    }
    .option-tile-selected-ts {
      background: rgba(49, 120, 198, 0.14);
      border-color: #3178C6;
      box-shadow: 4px 4px 0px #3178C6;
      transform: translate(-2px, -2px);
    }
    .option-tile-selected-nest {
      background: rgba(224, 35, 78, 0.14);
      border-color: #E0234E;
      box-shadow: 4px 4px 0px #E0234E;
      transform: translate(-2px, -2px);
    }
    .option-tile-selected-react {
      background: rgba(0, 216, 255, 0.12);
      border-color: #00D8FF;
      box-shadow: 4px 4px 0px #00D8FF;
      transform: translate(-2px, -2px);
    }

    .fade-in {
      animation: slideReveal 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideReveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0B0D10; }
    ::-webkit-scrollbar-thumb { background: #2D3748; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-obsidian text-slate-100 selection:bg-react selection:text-obsidian">
  
  <div id="root" class="flex-grow flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // Banco de 20 questões técnicas (TypeScript, NestJS e React)
    const QUESTIONS_DATA = [
      // --- TYPESCRIPT (7 questões) ---
      {
        id: 1,
        category: "TypeScript",
        question: "O que o utilitário 'Omit<T, K>' faz no TypeScript?",
        options: [
          "Remove as propriedades com valor null ou undefined de T.",
          "Cria um tipo com todas as propriedades de T, exceto as chaves listadas em K.",
          "Cria um tipo contendo apenas as chaves K de T.",
          "Torna as propriedades K de T opcionais.",
          "Apaga o tipo T do escopo global."
        ],
        correctIndex: 1,
        explanation: "Omit<T, K> constrói um novo tipo a partir de T removendo as chaves K. É o oposto de Pick<T, K>, que mantém apenas as chaves informadas."
      },
      {
        id: 2,
        category: "TypeScript",
        question: "Em qual situação o tipo 'never' é inferido ou utilizado?",
        options: [
          "Para valores que podem ser nulos em tempo de execução.",
          "Para funções que retornam undefined implicitamente.",
          "Para representar valores que nunca ocorrem, como o retorno de uma função que sempre lança exceção ou o caso exaustivo de um switch.",
          "Para variáveis que ainda não foram inicializadas.",
          "Para substituir o tipo 'any' de forma segura."
        ],
        correctIndex: 2,
        explanation: "'never' representa o conjunto vazio de valores. É útil em funções que nunca retornam e para checagem de exaustividade em unions discriminadas."
      },
      {
        id: 3,
        category: "TypeScript",
        question: "O que caracteriza uma 'Discriminated Union' (união discriminada)?",
        options: [
          "Uma union de tipos primitivos separados por vírgula.",
          "Uma union cujos membros compartilham uma propriedade literal em comum (ex: 'kind'), permitindo ao compilador fazer narrowing ao verificá-la.",
          "Uma union que só aceita valores numéricos.",
          "Uma interface que herda de várias classes ao mesmo tempo.",
          "Um enum com valores aleatórios gerados em runtime."
        ],
        correctIndex: 1,
        explanation: "Ao verificar a propriedade discriminante (ex: if (shape.kind === 'circle')), o TypeScript restringe automaticamente a union ao membro correspondente."
      },
      {
        id: 4,
        category: "TypeScript",
        question: "O que são 'Conditional Types' como 'T extends string ? \"sim\" : \"não\"'?",
        options: [
          "Tipos que só existem quando uma variável de ambiente está definida.",
          "Tipos que escolhem entre dois resultados com base em uma relação de assinabilidade entre tipos, resolvida em tempo de compilação.",
          "Blocos if/else que são executados em runtime pelo V8.",
          "Decorators que validam o valor de uma propriedade.",
          "Um recurso exclusivo para classes abstratas."
        ],
        correctIndex: 1,
        explanation: "Conditional types permitem expressar lógica no nível de tipos (T extends U ? X : Y) e são a base de utilitários como Exclude, Extract e ReturnType."
      },
      {
        id: 5,
        category: "TypeScript",
        question: "Qual é o benefício do operador 'satisfies' (TypeScript 4.9+)?",
        options: [
          "Valida o objeto em runtime e lança erro se estiver incorreto.",
          "Converte o valor para o tipo informado, ignorando incompatibilidades.",
          "Verifica se a expressão é compatível com um tipo sem alargar o tipo inferido, preservando a inferência mais específica.",
          "Torna todas as propriedades do objeto readonly.",
          "Permite importar tipos de outros pacotes sem instalá-los."
        ],
        correctIndex: 2,
        explanation: "Com 'satisfies' você garante conformidade com um tipo, mas mantém os tipos literais e específicos inferidos, algo que uma anotação de tipo comum perderia."
      },
      {
        id: 6,
        category: "TypeScript",
        question: "O que a opção 'strictNullChecks' do tsconfig faz?",
        options: [
          "Remove automaticamente valores null do código compilado.",
          "Faz com que null e undefined deixem de ser atribuíveis a todos os tipos, exigindo tratamento explícito.",
          "Impede o uso da palavra-chave null em qualquer arquivo.",
          "Converte undefined em null durante o build.",
          "Ativa a verificação de nulos apenas em arquivos .js."
        ],
        correctIndex: 1,
        explanation: "Com strictNullChecks ativo, 'string' não aceita mais null/undefined; é preciso declarar 'string | null' e tratar o caso, eliminando uma classe inteira de erros."
      },
      {
        id: 7,
        category: "TypeScript",
        question: "O que o modificador 'as const' faz em um literal de objeto, como 'const cfg = { mode: \"dark\" } as const'?",
        options: [
          "Congela o objeto em runtime com Object.freeze.",
          "Converte o objeto em uma classe imutável.",
          "Infere os valores como tipos literais e marca as propriedades como readonly, apenas em tempo de compilação.",
          "Impede que a variável cfg seja importada em outros arquivos.",
          "Transforma o objeto em um enum."
        ],
        correctIndex: 2,
        explanation: "'as const' faz com que mode seja inferido como o literal \"dark\" (e não string) e readonly. Não há nenhum efeito em runtime."
      },

      // --- NESTJS (7 questões) ---
      {
        id: 8,
        category: "NestJS",
        question: "Qual é o escopo padrão (lifetime) de um provider no NestJS?",
        options: [
          "Request: uma nova instância é criada para cada requisição.",
          "Transient: uma nova instância é criada para cada consumidor.",
          "Singleton: uma única instância é compartilhada por toda a aplicação.",
          "Session: uma instância por usuário autenticado.",
          "Lazy: instanciado apenas na primeira chamada e descartado depois."
        ],
        correctIndex: 2,
        explanation: "Por padrão, providers são singletons compartilhados. Escopos REQUEST e TRANSIENT existem, mas têm custo de performance e devem ser usados só quando necessário."
      },
      {
        id: 9,
        category: "NestJS",
        question: "Qual é a ordem correta de execução dos componentes no ciclo de vida de uma requisição no NestJS?",
        options: [
          "Pipes → Guards → Middleware → Interceptors → Handler",
          "Guards → Middleware → Pipes → Interceptors → Handler",
          "Interceptors → Middleware → Guards → Pipes → Handler",
          "Middleware → Guards → Interceptors (antes) → Pipes → Handler",
          "Handler → Middleware → Guards → Pipes → Interceptors"
        ],
        correctIndex: 3,
        explanation: "A ordem é: Middleware, Guards, Interceptors (pré-handler), Pipes, Handler, Interceptors (pós-handler) e, por fim, Exception Filters em caso de erro."
      },
      {
        id: 10,
        category: "NestJS",
        question: "O que o decorator @Global() faz em um módulo NestJS?",
        options: [
          "Faz o módulo ser carregado antes de todos os outros.",
          "Expõe os providers exportados do módulo para toda a aplicação, sem precisar importá-lo em cada módulo consumidor.",
          "Transforma todos os controllers do módulo em rotas públicas, sem autenticação.",
          "Compartilha o módulo entre diferentes aplicações NestJS.",
          "Desativa o encapsulamento de providers dentro do módulo."
        ],
        correctIndex: 1,
        explanation: "Um módulo @Global() só precisa ser importado uma vez (geralmente no AppModule); seus exports ficam disponíveis em todos os módulos. Deve ser usado com moderação."
      },
      {
        id: 11,
        category: "NestJS",
        question: "Qual é o papel de um Exception Filter no NestJS?",
        options: [
          "Validar o corpo da requisição com class-validator.",
          "Capturar exceções lançadas durante o processamento e controlar a resposta de erro enviada ao cliente.",
          "Filtrar quais rotas aparecem na documentação Swagger.",
          "Impedir que exceções sejam lançadas dentro de services.",
          "Registrar apenas métricas de performance."
        ],
        correctIndex: 1,
        explanation: "Exception Filters (@Catch) interceptam exceções, permitindo padronizar o formato de erro, registrar logs e mapear exceções de domínio para status HTTP."
      },
      {
        id: 12,
        category: "NestJS",
        question: "Para que serve um custom provider com 'useFactory' no NestJS?",
        options: [
          "Para criar controllers dinamicamente a partir de arquivos JSON.",
          "Para criar o provider por meio de uma função (podendo ser assíncrona e injetar outras dependências), útil em conexões e configurações dinâmicas.",
          "Para substituir o container de IoC do NestJS por outro framework.",
          "Para gerar migrations de banco de dados automaticamente.",
          "Para registrar rotas em tempo de execução."
        ],
        correctIndex: 1,
        explanation: "'useFactory' recebe dependências via 'inject' e retorna o valor do provider, inclusive de forma assíncrona, como em conexões com banco ou clientes externos."
      },
      {
        id: 13,
        category: "NestJS",
        question: "O que é um 'Dynamic Module' (ex: ConfigModule.forRoot()) no NestJS?",
        options: [
          "Um módulo que é recarregado automaticamente quando o arquivo muda.",
          "Um módulo cujos providers e imports são definidos em tempo de configuração, por meio de um método estático que retorna a definição do módulo.",
          "Um módulo que só é carregado quando a primeira requisição chega.",
          "Um módulo escrito em JavaScript puro, sem decorators.",
          "Um módulo que não pode ter controllers."
        ],
        correctIndex: 1,
        explanation: "Dynamic modules permitem parametrizar o módulo (forRoot, forRootAsync, register), retornando um objeto com module, providers, imports e exports."
      },
      {
        id: 14,
        category: "NestJS",
        question: "Qual recurso resolve dependências circulares entre dois providers no NestJS?",
        options: [
          "@Optional()",
          "@Global()",
          "forwardRef() combinado com @Inject()",
          "@Self()",
          "ModuleRef.destroy()"
        ],
        correctIndex: 2,
        explanation: "forwardRef() adia a resolução da referência, permitindo que duas classes (ou módulos) dependam uma da outra. Ainda assim, uma dependência circular costuma indicar problema de design."
      },

      // --- REACT (6 questões) ---
      {
        id: 15,
        category: "React",
        question: "Qual é o principal objetivo do hook 'useCallback'?",
        options: [
          "Executar uma função assim que o componente for montado.",
          "Manter a mesma referência de uma função entre renderizações enquanto suas dependências não mudarem.",
          "Armazenar o resultado de uma requisição HTTP.",
          "Substituir o uso de props em componentes filhos.",
          "Disparar uma nova renderização de forma síncrona."
        ],
        correctIndex: 1,
        explanation: "useCallback memoriza a função em si. É útil ao passar callbacks para componentes envolvidos em React.memo ou para dependências estáveis de useEffect."
      },
      {
        id: 16,
        category: "React",
        question: "Quando a função de limpeza (cleanup) retornada por um useEffect é executada?",
        options: [
          "Apenas quando a página é fechada pelo navegador.",
          "Antes de o efeito rodar novamente (quando as dependências mudam) e quando o componente é desmontado.",
          "Somente na primeira renderização.",
          "Nunca, a menos que se use useLayoutEffect.",
          "Imediatamente após cada chamada de setState, em qualquer componente."
        ],
        correctIndex: 1,
        explanation: "O cleanup serve para cancelar subscriptions, timers e listeners. Ele roda antes da próxima execução do efeito e no unmount."
      },
      {
        id: 17,
        category: "React",
        question: "O que o 'React.memo' faz ao envolver um componente funcional?",
        options: [
          "Salva o estado do componente no localStorage.",
          "Evita que o componente seja renderizado novamente se suas props não mudaram (comparação rasa).",
          "Impede que o componente receba qualquer prop nova.",
          "Faz o componente ser renderizado apenas no servidor.",
          "Transforma o componente em um hook personalizado."
        ],
        correctIndex: 1,
        explanation: "React.memo compara as props anteriores e novas de forma rasa e pula a re-renderização se forem iguais. Props de objetos/funções precisam de referências estáveis para funcionar bem."
      },
      {
        id: 18,
        category: "React",
        question: "Qual é a diferença entre um componente controlado e um não controlado em formulários?",
        options: [
          "Controlados só funcionam com inputs de texto; não controlados só com checkbox.",
          "No controlado o valor do input vem do estado do React (value + onChange); no não controlado o DOM mantém o valor e ele é lido via ref.",
          "No controlado o valor fica salvo no servidor; no não controlado fica no localStorage.",
          "Não há diferença prática entre os dois.",
          "Componentes não controlados exigem Redux."
        ],
        correctIndex: 1,
        explanation: "Em inputs controlados, o React é a 'fonte da verdade' do valor. Em não controlados, o próprio DOM guarda o valor e você o acessa quando necessário (ex: via useRef)."
      },
      {
        id: 19,
        category: "React",
        question: "Por que, em desenvolvimento, o <React.StrictMode> (React 18) executa os efeitos duas vezes na montagem?",
        options: [
          "É um bug conhecido do React 18 que será corrigido.",
          "Para simular desmontagem e remontagem, ajudando a detectar efeitos sem cleanup adequado ou com efeitos colaterais impuros.",
          "Para dobrar a performance do componente em produção.",
          "Porque o Babel compila o código duas vezes.",
          "Para sincronizar o estado com o servidor."
        ],
        correctIndex: 1,
        explanation: "O StrictMode só afeta o ambiente de desenvolvimento. A dupla execução expõe efeitos que não são resilientes a montar/desmontar, preparando o código para recursos concorrentes."
      },
      {
        id: 20,
        category: "React",
        question: "Quando 'useReducer' costuma ser mais adequado do que 'useState'?",
        options: [
          "Quando o estado é um único valor booleano.",
          "Quando o estado é complexo, com várias sub-partes ou transições que dependem do estado anterior, centralizando a lógica em um reducer.",
          "Quando se deseja evitar completamente re-renderizações.",
          "Quando o componente é uma classe.",
          "Quando o estado precisa ser compartilhado entre abas do navegador."
        ],
        correctIndex: 1,
        explanation: "useReducer centraliza transições de estado em uma função pura (state, action) → novo state, o que facilita testes e deixa a lógica mais previsível em estados complexos."
      }
    ];

    const PASSING_PERCENTAGE = 70;
    const MIN_CORRECT_ANSWERS = Math.ceil((QUESTIONS_DATA.length * PASSING_PERCENTAGE) / 100); // 14 de 20
    const OPTION_LETTERS = ['A', 'B', 'C', 'D', 'E'];

    // Configuração visual temática por tecnologia
    const TECH_THEME = {
      TypeScript: {
        badge: "bg-[#3178C6]/15 text-[#66A8F5] border-[#3178C6]/60",
        dot: "bg-[#3178C6]",
        bar: "bg-[#3178C6]",
        selectedTile: "option-tile-selected-ts",
        selectedLetter: "bg-[#3178C6] text-white border-[#3178C6]",
        code: "TS // STATIC_TYPES"
      },
      NestJS: {
        badge: "bg-[#E0234E]/15 text-[#FF6B8B] border-[#E0234E]/60",
        dot: "bg-[#E0234E]",
        bar: "bg-[#E0234E]",
        selectedTile: "option-tile-selected-nest",
        selectedLetter: "bg-[#E0234E] text-white border-[#E0234E]",
        code: "NEST // MODULAR_ARCH"
      },
      React: {
        badge: "bg-[#00D8FF]/15 text-[#5CE6FF] border-[#00D8FF]/60",
        dot: "bg-[#00D8FF]",
        bar: "bg-[#00D8FF]",
        selectedTile: "option-tile-selected-react",
        selectedLetter: "bg-[#00D8FF] text-[#0B0D10] border-[#00D8FF]",
        code: "REACT // UI_ENGINE"
      }
    };

    function CategoryBadge({ category, showTagCode = false }) {
      const theme = TECH_THEME[category] || TECH_THEME.TypeScript;
      return (
        <span className={`inline-flex items-center gap-2 px-3 py-1 rounded-sm text-xs font-mono font-semibold uppercase tracking-wider border ${theme.badge}`}>
          <span className={`w-2 h-2 rounded-xs ${theme.dot}`}></span>
          <span>{category}</span>
          {showTagCode && (
            <span className="opacity-60 hidden sm:inline">| {theme.code.split('// ')[1]}</span>
          )}
        </span>
      );
    }

    function App() {
      const [screen, setScreen] = useState('start'); // 'start' | 'quiz' | 'result'
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [showReview, setShowReview] = useState(false);

      const totalQuestions = QUESTIONS_DATA.length;
      const currentQuestion = QUESTIONS_DATA[currentQuestionIndex];
      const answeredCount = Object.keys(userAnswers).length;

      const handleStartQuiz = () => {
        setUserAnswers({});
        setCurrentQuestionIndex(0);
        setShowReview(false);
        setScreen('quiz');
      };

      const handleSelectOption = (optionIndex) => {
        setUserAnswers((prev) => ({
          ...prev,
          [currentQuestion.id]: optionIndex
        }));
      };

      const handleNext = () => {
        if (currentQuestionIndex < totalQuestions - 1) {
          setCurrentQuestionIndex((prev) => prev + 1);
        } else {
          setScreen('result');
        }
      };

      const handlePrevious = () => {
        if (currentQuestionIndex > 0) {
          setCurrentQuestionIndex((prev) => prev - 1);
        }
      };

      const results = useMemo(() => {
        let score = 0;
        const byCategory = {
          TypeScript: { correct: 0, total: 0 },
          NestJS: { correct: 0, total: 0 },
          React: { correct: 0, total: 0 }
        };

        QUESTIONS_DATA.forEach((q) => {
          byCategory[q.category].total += 1;
          if (userAnswers[q.id] === q.correctIndex) {
            score += 1;
            byCategory[q.category].correct += 1;
          }
        });

        const percentage = Math.round((score / totalQuestions) * 100);
        const passed = score >= MIN_CORRECT_ANSWERS;

        return { score, percentage, passed, byCategory };
      }, [userAnswers, totalQuestions]);

      const activeTheme = currentQuestion ? TECH_THEME[currentQuestion.category] : TECH_THEME.TypeScript;

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-[#0B0D10]/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-20">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-sm bg-[#141922] border border-slate-700 text-react flex items-center justify-center font-mono font-bold text-sm shadow-[3px_3px_0px_#3178C6]">
                  &lt;/&gt;
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-display font-bold text-white text-sm sm:text-base tracking-tight uppercase">
                      EVIRA.Quiz // Fullstack
                    </h1>
                    <span className="hidden md:inline-block px-1.5 py-0.5 text-[10px] font-mono bg-slate-800 text-slate-300 border border-slate-700 rounded-xs">
                      v2.6
                    </span>
                  </div>
                  <p className="text-[11px] font-mono text-slate-400">
                    TS • NESTJS • REACT
                  </p>
                </div>
              </div>

              {screen === 'quiz' && (
                <div className="flex items-center gap-3">
                  <span className="text-xs font-mono text-slate-400 hidden sm:inline">
                    RESPONDIDAS: <strong className="text-white">{String(answeredCount).padStart(2, '0')}</strong>/{totalQuestions}
                  </span>
                  <span className="px-3 py-1 rounded-sm bg-[#161C26] border border-slate-700 text-react font-mono text-xs font-bold">
                    Q.{String(currentQuestionIndex + 1).padStart(2, '0')} / {totalQuestions}
                  </span>
                </div>
              )}
            </div>
          </header>

          <main className="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10 flex flex-col justify-center">
            
            {/* TELA 1: INÍCIO */}
            {screen === 'start' && (
              <div className="blueprint-card corner-ticks rounded-sm p-6 sm:p-10 fade-in">
                <div className="flex flex-wrap items-center justify-between gap-3 pb-6 mb-6 border-b border-slate-800/90">
                  <div className="flex flex-wrap gap-2">
                    <CategoryBadge category="TypeScript" />
                    <CategoryBadge category="NestJS" />
                    <CategoryBadge category="React" />
                  </div>
                  <span className="font-mono text-xs text-slate-400">
                    MODULE_ID: EXAM-20Q
                  </span>
                </div>

                <h2 className="font-display text-3xl sm:text-4xl font-bold text-white tracking-tight leading-tight mb-4">
                  Avaliação Técnica de Arquitetura &amp; Tipagem Moderna
                </h2>
                <p className="text-slate-300 text-base sm:text-lg leading-relaxed mb-8 max-w-2xl">
                  Valide seu domínio em tipagem estática avançada com <span className="text-[#66A8F5] font-medium">TypeScript</span>, injeção de dependência e arquitetura modular com <span className="text-[#FF6B8B] font-medium">NestJS</span>, e renderização reativa com <span className="text-[#5CE6FF] font-medium">React</span>.
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                  <div className="p-4 rounded-sm bg-[#0C0F14] border border-slate-800 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-0.5 bg-ts"></div>
                    <div className="text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">
                      01 // Escopo
                    </div>
                    <div className="font-display text-2xl font-bold text-white">
                      {totalQuestions} Questões
                    </div>
                    <div className="text-xs font-mono text-slate-400 mt-1">
                      7 TS • 7 NestJS • 6 React
                    </div>
                  </div>

                  <div className="p-4 rounded-sm bg-[#0C0F14] border border-slate-800 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-0.5 bg-emerald-400"></div>
                    <div className="text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">
                      02 // Nota de Corte
                    </div>
                    <div className="font-display text-2xl font-bold text-emerald-400">
                      Mínimo {PASSING_PERCENTAGE}%
                    </div>
                    <div className="text-xs font-mono text-slate-400 mt-1">
                      {MIN_CORRECT_ANSWERS} de {totalQuestions} acertos exigidos
                    </div>
                  </div>

                  <div className="p-4 rounded-sm bg-[#0C0F14] border border-slate-800 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-0.5 bg-react"></div>
                    <div className="text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1">
                      03 // Diagnóstico
                    </div>
                    <div className="font-display text-2xl font-bold text-white">
                      Gabarito
                    </div>
                    <div className="text-xs font-mono text-slate-400 mt-1">
                      Análise técnica comentada
                    </div>
                  </div>
                </div>

                <div className="bg-[#0C0F14] border-l-4 border-react p-5 mb-8">
                  <h3 className="font-mono text-xs font-bold uppercase tracking-wider text-react mb-3">
                    &gt; Protocolo de Execução:
                  </h3>
                  <ul className="space-y-2 text-sm text-slate-300 font-mono">
                    <li className="flex items-start gap-2">
                      <span className="text-react">[+]</span>
                      <span>5 alternativas (A–E) por questão, com <strong className="text-white">única resposta correta</strong>.</span>
                    </li>
                    <li className="flex items-start gap-2">
                      <span className="text-react">[+]</span>
                      <span>Navegação livre entre questões anteriores e próximas antes da submissão.</span>
                    </li>
                    <li className="flex items-start gap-2">
                      <span className="text-react">[+]</span>
                      <span>Pontuação unitária (1.0 pt/acerto) com relatório de aprovação imediato.</span>
                    </li>
                  </ul>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={handleStartQuiz}
                    className="btn-cyber w-full sm:w-auto px-8 py-4 rounded-sm font-display font-bold text-base uppercase tracking-wider cursor-pointer flex items-center justify-center gap-3"
                  >
                    <span>Iniciar Avaliação</span>
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                  </button>
                </div>
              </div>
            )}

            {/* TELA 2: QUIZ EM ANDAMENTO */}
            {screen === 'quiz' && (
              <div className="fade-in">
                <div className="mb-6 bg-[#11151D] border border-slate-800 p-3.5 rounded-sm">
                  <div className="flex justify-between items-center text-xs font-mono text-slate-400 mb-2.5">
                    <span>PROGRESSO DA SESSÃO // {activeTheme.code}</span>
                    <span className="text-white font-bold">
                      {Math.round(((currentQuestionIndex + 1) / totalQuestions) * 100)}%
                    </span>
                  </div>
                  <div className="grid grid-cols-20 gap-1" style={{ gridTemplateColumns: 'repeat(20, minmax(0, 1fr))' }}>
                    {QUESTIONS_DATA.map((q, idx) => {
                      const qTheme = TECH_THEME[q.category];
                      const isAnswered = userAnswers[q.id] !== undefined;
                      const isCurrent = idx === currentQuestionIndex;
                      return (
                        <button
                          key={q.id}
                          type="button"
                          onClick={() => setCurrentQuestionIndex(idx)}
                          title={`Questão ${idx + 1} (${q.category})`}
                          className={`h-2.5 rounded-[1px] transition-all cursor-pointer ${
                            isCurrent
                              ? "bg-white scale-y-125 shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                              : isAnswered
                              ? qTheme.bar
                              : "bg-slate-800 hover:bg-slate-700"
                          }`}
                        />
                      );
                    })}
                  </div>
                </div>

                <div className="blueprint-card corner-ticks rounded-sm p-6 sm:p-8">
                  <div className="flex flex-wrap items-center justify-between gap-4 pb-5 mb-6 border-b border-slate-800">
                    <CategoryBadge category={currentQuestion.category} showTagCode={true} />
                    <span className="text-xs font-mono text-slate-400 bg-[#0B0D10] px-2.5 py-1 border border-slate-800 rounded-xs">
                      INDEX #{String(currentQuestion.id).padStart(2, '0')}
                    </span>
                  </div>

                  <h3 className="font-display text-xl sm:text-2xl font-bold text-white leading-snug mb-7">
                    <span className="font-mono text-slate-500 mr-2">
                      {String(currentQuestionIndex + 1).padStart(2, '0')}.
                    </span>
                    {currentQuestion.question}
                  </h3>

                  <div className="space-y-3" role="radiogroup" aria-label="Alternativas da questão">
                    {currentQuestion.options.map((optionText, idx) => {
                      const isSelected = userAnswers[currentQuestion.id] === idx;
                      return (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => handleSelectOption(idx)}
                          className={`option-tile w-full text-left p-4 rounded-sm flex items-start gap-4 cursor-pointer ${
                            isSelected ? activeTheme.selectedTile : ""
                          }`}
                        >
                          <span
                            className={`w-8 h-8 rounded-xs border flex items-center justify-center font-mono text-xs font-bold shrink-0 mt-0.5 transition-colors ${
                              isSelected
                                ? activeTheme.selectedLetter
                                : "bg-[#161C26] text-slate-400 border-slate-700"
                            }`}
                          >
                            {OPTION_LETTERS[idx]}
                          </span>
                          <span className={`text-sm sm:text-base leading-relaxed ${isSelected ? "font-medium text-white" : "text-slate-300"}`}>
                            {optionText}
                          </span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="mt-8 pt-6 border-t border-slate-800 flex flex-col-reverse sm:flex-row items-center justify-between gap-4">
                    <button
                      type="button"
                      onClick={handlePrevious}
                      disabled={currentQuestionIndex === 0}
                      className="btn-outline-cyber w-full sm:w-auto px-5 py-2.5 rounded-sm font-mono text-xs font-semibold uppercase tracking-wider disabled:opacity-35 disabled:pointer-events-none cursor-pointer"
                    >
                      &lt;- Anterior
                    </button>

                    <div className="flex items-center gap-4 w-full sm:w-auto justify-end">
                      {userAnswers[currentQuestion.id] === undefined && (
                        <span className="text-xs font-mono text-amber-400 hidden sm:inline">
                          [!] Selecione uma opção
                        </span>
                      )}
                      <button
                        type="button"
                        onClick={handleNext}
                        disabled={userAnswers[currentQuestion.id] === undefined}
                        className="btn-cyber w-full sm:w-auto px-6 py-3 rounded-sm font-display font-bold text-sm uppercase tracking-wider disabled:cursor-not-allowed cursor-pointer"
                      >
                        {currentQuestionIndex === totalQuestions - 1
                          ? "Finalizar & Calcular ->"
                          : "Próxima Questão ->"}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="mt-6 bg-[#11151D] rounded-sm border border-slate-800 p-4">
                  <div className="flex items-center justify-between mb-3">
                    <p className="text-xs font-mono uppercase tracking-wider text-slate-400">
                      Mapa de Questões // Acesso Direto
                    </p>
                    <div className="flex items-center gap-3 text-[11px] font-mono text-slate-400">
                      <span className="flex items-center gap-1"><span className="w-2 h-2 bg-ts inline-block"></span>TS</span>
                      <span className="flex items-center gap-1"><span className="w-2 h-2 bg-nest inline-block"></span>Nest</span>
                      <span className="flex items-center gap-1"><span className="w-2 h-2 bg-react inline-block"></span>React</span>
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {QUESTIONS_DATA.map((q, idx) => {
                      const isAnswered = userAnswers[q.id] !== undefined;
                      const isCurrent = idx === currentQuestionIndex;
                      const qTheme = TECH_THEME[q.category];
                      return (
                        <button
                          key={q.id}
                          onClick={() => setCurrentQuestionIndex(idx)}
                          className={`w-9 h-9 rounded-xs font-mono text-xs font-bold border transition-all cursor-pointer ${
                            isCurrent
                              ? "bg-white text-obsidian border-white shadow-[2px_2px_0px_#00D8FF]"
                              : isAnswered
                              ? `${qTheme.badge}`
                              : "bg-[#0B0D10] text-slate-500 border-slate-800 hover:border-slate-600"
                          }`}
                          title={`Questão ${idx + 1} (${q.category})`}
                        >
                          {String(idx + 1).padStart(2, '0')}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TELA 3: RESULTADO E REVISÃO */}
            {screen === 'result' && (
              <div className="space-y-6 fade-in">
                <div className="blueprint-card corner-ticks rounded-sm overflow-hidden">
                  <div
                    className={`p-6 sm:p-10 text-center border-b border-slate-800 relative ${
                      results.passed
                        ? "bg-gradient-to-b from-emerald-950/50 to-transparent"
                        : "bg-gradient-to-b from-rose-950/50 to-transparent"
                    }`}
                  >
                    <div
                      className={`w-16 h-16 rounded-sm mx-auto mb-5 flex items-center justify-center border-2 ${
                        results.passed
                          ? "bg-emerald-500/15 border-emerald-400 text-emerald-400 shadow-[4px_4px_0px_#10B981]"
                          : "bg-rose-500/15 border-rose-500 text-rose-400 shadow-[4px_4px_0px_#F43F5E]"
                      }`}
                    >
                      {results.passed ? (
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                        </svg>
                      ) : (
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                      )}
                    </div>

                    <span
                      className={`inline-block px-3.5 py-1 rounded-xs font-mono text-xs font-bold uppercase tracking-widest border mb-3 ${
                        results.passed
                          ? "bg-emerald-500/15 text-emerald-300 border-emerald-500/50"
                          : "bg-rose-500/15 text-rose-300 border-rose-500/50"
                      }`}
                    >
                      {results.passed ? "STATUS // APROVADO" : "STATUS // REPROVADO"}
                    </span>

                    <h2 className="font-display text-2xl sm:text-4xl font-bold text-white tracking-tight">
                      {results.passed
                        ? "Certificação Técnica Atingida"
                        : "Pontuação Abaixo do Critério Mínimo"}
                    </h2>
                    <p className="font-mono text-xs sm:text-sm text-slate-400 mt-2">
                      THRESHOLD EXIGIDO: {MIN_CORRECT_ANSWERS}/{totalQuestions} ACERTOS ({PASSING_PERCENTAGE}%)
                    </p>
                  </div>

                  <div className="p-6 sm:p-8">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                      <div className="p-4 rounded-sm bg-[#0B0D10] border border-slate-800 text-center">
                        <div className="text-[11px] font-mono uppercase text-slate-400">Score Final</div>
                        <div className="font-display text-2xl sm:text-3xl font-bold text-white mt-1">
                          {results.score}<span className="text-base font-mono text-slate-500">/{totalQuestions}</span>
                        </div>
                      </div>

                      <div className="p-4 rounded-sm bg-[#0B0D10] border border-slate-800 text-center">
                        <div className="text-[11px] font-mono uppercase text-slate-400">Aproveitamento</div>
                        <div className={`font-display text-2xl sm:text-3xl font-bold mt-1 ${results.passed ? "text-emerald-400" : "text-rose-400"}`}>
                          {results.percentage}%
                        </div>
                      </div>

                      <div className="p-4 rounded-sm bg-[#0B0D10] border border-slate-800 text-center">
                        <div className="text-[11px] font-mono uppercase text-slate-400">Acertos</div>
                        <div className="font-display text-2xl sm:text-3xl font-bold text-emerald-400 mt-1">
                          {String(results.score).padStart(2, '0')}
                        </div>
                      </div>

                      <div className="p-4 rounded-sm bg-[#0B0D10] border border-slate-800 text-center">
                        <div className="text-[11px] font-mono uppercase text-slate-400">Erros</div>
                        <div className="font-display text-2xl sm:text-3xl font-bold text-rose-400 mt-1">
                          {String(totalQuestions - results.score).padStart(2, '0')}
                        </div>
                      </div>
                    </div>

                    <div className="mb-8">
                      <h3 className="font-mono text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">
                        &gt; Telemetria por Stack:
                      </h3>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        {Object.entries(results.byCategory).map(([cat, stats]) => {
                          const pct = Math.round((stats.correct / stats.total) * 100);
                          const catTheme = TECH_THEME[cat];
                          return (
                            <div key={cat} className="p-4 rounded-sm border border-slate-800 bg-[#0B0D10]">
                              <div className="flex items-center justify-between mb-3">
                                <CategoryBadge category={cat} />
                                <span className="font-mono text-xs font-bold text-white">
                                  {stats.correct}/{stats.total} ({pct}%)
                                </span>
                              </div>
                              <div className="w-full h-2 bg-slate-800 rounded-xs overflow-hidden">
                                <div
                                  className={`h-full ${catTheme.bar} transition-all duration-500`}
                                  style={{ width: `${pct}%` }}
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                      <button
                        type="button"
                        onClick={() => setShowReview((prev) => !prev)}
                        className="btn-outline-cyber w-full sm:w-auto px-6 py-3.5 rounded-sm font-mono text-xs font-bold uppercase tracking-wider cursor-pointer"
                      >
                        {showReview ? "[-] Ocultar Gabarito" : "[+] Revisar Gabarito Comentado"}
                      </button>

                      <button
                        type="button"
                        onClick={handleStartQuiz}
                        className="btn-cyber w-full sm:w-auto px-7 py-3.5 rounded-sm font-display font-bold text-sm uppercase tracking-wider cursor-pointer"
                      >
                        Reiniciar Avaliação
                      </button>
                    </div>
                  </div>
                </div>

                {showReview && (
                  <div className="space-y-4 fade-in">
                    <div className="flex items-center justify-between px-1 pt-2">
                      <h3 className="font-display text-xl font-bold text-white">
                        Log de Revisão Técnica
                      </h3>
                      <span className="font-mono text-xs text-slate-400">
                        TOTAL: {totalQuestions} REGISTROS
                      </span>
                    </div>

                    {QUESTIONS_DATA.map((q, index) => {
                      const selectedIdx = userAnswers[q.id];
                      const isCorrect = selectedIdx === q.correctIndex;

                      return (
                        <div
                          key={q.id}
                          className={`bg-[#11151D] rounded-sm border p-5 sm:p-6 ${
                            isCorrect ? "border-emerald-500/40" : "border-rose-500/40"
                          }`}
                        >
                          <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                            <div className="flex items-center gap-2.5">
                              <span className="font-mono text-xs font-bold text-slate-400">
                                Q.{String(index + 1).padStart(2, '0')}
                              </span>
                              <CategoryBadge category={q.category} />
                            </div>
                            <span
                              className={`px-2.5 py-0.5 rounded-xs font-mono text-xs font-bold border ${
                                isCorrect
                                  ? "bg-emerald-500/15 text-emerald-300 border-emerald-500/40"
                                  : "bg-rose-500/15 text-rose-300 border-rose-500/40"
                              }`}
                            >
                              {isCorrect ? "[OK] CORRETA" : "[ERR] INCORRETA"}
                            </span>
                          </div>

                          <p className="font-display font-bold text-white text-base sm:text-lg mb-4">
                            {q.question}
                          </p>

                          <div className="space-y-2 mb-4">
                            {q.options.map((opt, optIdx) => {
                              const isUserChoice = selectedIdx === optIdx;
                              const isRightAnswer = q.correctIndex === optIdx;

                              let boxStyle = "border-slate-800 bg-[#0B0D10] text-slate-400";
                              let badgeStyle = "bg-slate-800 text-slate-400";

                              if (isRightAnswer) {
                                boxStyle = "border-emerald-500/70 bg-emerald-500/10 text-emerald-100 font-medium";
                                badgeStyle = "bg-emerald-500 text-obsidian";
                              } else if (isUserChoice && !isRightAnswer) {
                                boxStyle = "border-rose-500/70 bg-rose-500/10 text-rose-100";
                                badgeStyle = "bg-rose-500 text-white";
                              }

                              return (
                                <div
                                  key={optIdx}
                                  className={`p-3 rounded-sm border text-sm flex items-start justify-between gap-3 ${boxStyle}`}
                                >
                                  <div className="flex items-start gap-3">
                                    <span className={`w-6 h-6 rounded-xs flex items-center justify-center font-mono text-xs font-bold shrink-0 ${badgeStyle}`}>
                                      {OPTION_LETTERS[optIdx]}
                                    </span>
                                    <span>{opt}</span>
                                  </div>
                                  <div className="shrink-0 font-mono text-[11px] font-bold uppercase">
                                    {isRightAnswer && (
                                      <span className="text-emerald-400">Gabarito</span>
                                    )}
                                    {isUserChoice && !isRightAnswer && (
                                      <span className="text-rose-400">Sua Escolha</span>
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                          <div className="p-3.5 rounded-sm bg-[#0B0D10] border-l-2 border-slate-500 text-xs sm:text-sm text-slate-300">
                            <strong className="font-mono text-white uppercase text-xs mr-1.5">
                              Nota Técnica:
                            </strong>
                            {q.explanation}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="border-t border-slate-800/90 bg-[#0B0D10] py-5 mt-8">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2 font-mono text-xs text-slate-500">
              <span>PROJETO QUIZ FULLSTACK // REACT • TYPESCRIPT • NESTJS</span>
              <span>APROVAÇÃO: {MIN_CORRECT_ANSWERS}/{totalQuestions} ({PASSING_PERCENTAGE}%)</span>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
